          - number: 64
            slot: "15:40 - 16:20"
            who: "Izabela Lipińska"
            title: "Cognitive deskilling w pracy PM-a"
            description: >
              Kierownik projektu pod presją coraz częściej oddaje analizę modelom językowym. Izabela pokaże dwa
              skutki: ulgę poznawczą, którą mylimy z rzetelną wiedzą, oraz przeładowanie, przy którym praca
              przyspiesza bez postępów. Oba prowadzą do cognitive deskillingu, czyli utraty kompetencji
              poznawczych stanowiących o wartości PM-a. Poznasz konkretny scenariusz rozmowy z modelem i sposoby
              pracy z tym ryzykiem.


        ### Main Stage sessions - Part 1
          - number: 1
            slot: "8:45 - 9:30"
            who: "Rejestracja uczestników i networking przy kawie"
            title:  # null
            description: >
              Przyjdź i zarejestruj się, uniknij kolejki i skorzystaj z networkingu przed wydarzeniem.

          - number: 5
            slot: "9:30 - 9:45"
            who: "Rozpoczęcie konferencji"
            title: "prof. UMK Marlena Ciechan-Kujawa oraz Maciej Koszykowski"
            description: >
              Krótkie przemowy powitalne organizatorów WNEiZ UMK oraz PMI&nbsp;PC&nbsp;Kujawsko-Pomorskie.

          - number: 10
            slot: "9:45 - 10:30"
            who: "Opening Keynote: prof. Jakub Growiec"
            title: >
              Transformatywna AI: obietnica przyspieszenia wzrostu czy zagrożenie egzystencjalne dla ludzkości?
            description: >
              Czy AI, która przewyższy ludzi we wszystkich ekonomicznie wartościowych zadaniach, przyniesie
              bezprecedensowy dobrobyt czy koniec ludzkości? Jakub uporządkuje scenariusze rozwoju
              transformatywnej AI i oceni ich skutki gospodarcze oraz ryzyka egzystencjalne. Pokaże, dlaczego
              nawet mało prawdopodobne scenariusze katastroficzne uzasadniają poważne inwestycje w badania nad
              bezpieczeństwem AI. Wykład otwierający, oparty na badaniach własnych.

          - number: 12
            slot: "10:30 - 10:55"
            who: "mec. Tomasz Sowa"
            title: "Temat w opracowaniu"
            description: >
              Temat został zatwierdzony, trwają prace nad doprecyzowaniem szczegółów. Zachęcamy do śledzenia
              naszych mediów społecznościowych. Po publikacji zapowiedzi agenda zostanie zaktualizowana.

          - number: 15
            slot: "10:55 - 11:10"
            who: ""
            title: "Podział na sale – wybierz prelekcje dla siebie"
            description: >
              Po rozpoczęciu konferencji uczestnicy będą mogli rozchodzić się na dwie sale według własnego wyboru,
              dostosowując udział do tematów, które najbardziej ich interesują.
              Wiemy, że wybór może być trudny, ale tematyka jest tak obszerna, że warto było uwzględnić różnorodne zagadnienia,
              aby każdy mógł znaleźć coś dla siebie.
              Niewątpliwie networking umożliwi wymianę informacji i ciekawe rozmowy.
              Zachęcamy do rozmów o wystąpieniach – to świetna okazja do wymiany wrażeń i pogłębienia wiedzy.

        ### Hard Sessions
          - number: 20
            slot: "room split"
            #room: Sala not used
            title: "Ścieżka Organizacyjna"
            icon: gear.png

          - number: 22
            slot: "11:10 - 11:50"
            who: "Tomasz Żabiński"
            title: "Efektywne, odpowiedzialne i bezpieczne wdrażanie AI i Physical AI w firmach produkcyjnych"
            description: >
              Sztuczna inteligencja wchodzi do hal produkcyjnych w fizycznej postaci. Tomasz pokaże, jak wdrażać
              AI i roboty humanoidalne w firmach produkcyjnych: które obszary automatyzować, jak pracować z
              oporem zespołów i co mówią badania o zmianie stanowisk pracy. Poruszy też bezpieczeństwo techniczne
              i psychologiczne, wymogi AI Act oraz źródła finansowania. Wyjdziesz z listą kwestii do
              rozstrzygnięcia przed startem takiego projektu.
            icon: gear.png

          - number: 23
            slot: "11:50 - 12:30"
            who: "Dorota Mleczko"
            title: Rewolucja ról. Jak sztuczna inteligencja zmienia struktury zespołów projektowych i co to oznacza dla kierownika projektu
            description: >
              Programiści wspierani przez agentów AI dostarczają w dwa dni to, co planowano na sześć tygodni.
              Dorota pokaże, co ta zmiana tempa robi z rolami Właściciela Produktu, Kierownika Projektu i
              Kierownika Programu. Opiera się na obserwacjach z wdrożeń AI w europejskich organizacjach i
              rozmowach z zespołami produktowymi. Dostaniesz argumenty, żeby przemyśleć strukturę zespołu,
              którym zarządzasz.
            icon: gear.png

          - number: 25
            slot: "13:30 - 14:10"
            who: Łukasz Karwacki
            title: "Od statusu do decyzji: jak PM staje się architektem decyzji w erze AI"
            description: >
              Organizacje mają więcej danych niż kiedykolwiek, a decyzje zapadają wolniej. Łukasz pokaże,
              dlaczego spotkania projektowe kończą się synchronizacją statusu zamiast rozstrzygnięciem. Wyjaśni,
              na czym polega decision architecture: porządkowanie opcji, pokazywanie konsekwencji i redukowanie
              przeciążenia poznawczego interesariuszy. Punktem wyjścia są obserwacje z pracy z liderami
              prezentującymi złożone tematy zarządom. Wyjdziesz z modelem myślenia do zastosowania następnego dnia.
            icon: gear.png

          - number: 28
            slot: "14:10 - 14:50"
            who: "Katarzyna Michno"
            title: 'Nowa struktura projektu: jak agenci AI przejmują role w zespole - case study'
            description: >
              Zespoły projektowe przestają być wyłącznie ludzkie. Katarzyna pokaże eksperymenty, w których agenci
              AI przejmowali konkretne role: analityka, PMO, QA i wsparcia decyzyjnego. Każdy wariant
              przeanalizuje pod kątem wpływu na przebieg projektu, jakość rezultatów i sposób podejmowania
              decyzji. Wyjdziesz z konkretnym obrazem tego, co działa, a co się sypie w zespole hybrydowym.
            icon: gear.png

        ### Soft Sessions
          - number: 30
            slot: "room split"
            #room: Sala not used
            title: "Ścieżka Psychologiczna"
            icon: brain.png

          - number: 31
            slot: "11:10 - 11:50"
            who: "Łukasz Wojtkowski"
            title: "UNBOX: od czarnej skrzynki do relacyjnej architektury decyzji"
            description: >
              Projekt to sieć relacji między ludźmi, danymi, procedurami i interesariuszami. AI wchodzi w nią jako
              aktywny uczestnik: przesuwa sprawczość i rozprasza odpowiedzialność. Łukasz przedstawi autorską
              ramę UNBOX, która pomaga rozpoznać, gdzie decyzja naprawdę powstaje i kto może ją zatrzymać.
              Wyjdziesz ze schematem do świadomego projektowania odpowiedzialności w projektach z AI.
            icon: brain.png

          - number: 32
            slot: "11:50 - 12:30"
            who: "Lucyna Ławniczak"
            title: "Bezpieczeństwo psychologiczne w erze AI: czego nie widzimy, a co nami zarządza"
            description: >
              Organizacje kupują narzędzia AI, zespoły zgadzają się, że są dobre, i nikt ich nie wdraża. Lucyna
              wyjaśni ten paradoks mechanizmem nierozpoznań z Analizy Transakcyjnej, czyli pomniejszania istotnych
              faktów o sobie, innych i sytuacji. Pokaże, jak prowadzi on do rozmycia ról i odkładania decyzji.
              Dostaniesz odpowiedź, dlaczego brak bezpieczeństwa psychologicznego blokuje wdrożenia.
            icon: brain.png

          - number: 38
            slot: "13:30 - 14:10"
            who: "Paweł Szczęsny"
            title: "AI czyli 'kto'? O ukrytych preferencjach systemów AI w kontekście zarządzania projektami "
            description: >
              Zakładamy, że AI to narzędzie bez własnego punktu widzenia. Paweł pokaże, że systemy AI mają ukryte
              preferencje: domyślne założenia, wzorce interpretacji i określony stosunek do ryzyka. W projekcie
              wpływa to na priorytety, ocenę sytuacji i rozumienie sukcesu. Zaczniesz patrzeć na AI jak na
              aktywnego uczestnika środowiska projektowego.
            icon: brain.png

          - number: 65
            slot: "14:10 - 14:50"
            who: "Arkadiusz Gut"
            title: "Czy LLM-y mają dialogiczne i empatyczne self? O granicach zastępowania ludzi sztucznymi agentami w kulturowo wrażliwych przedsięwzięciach grupowych"
            description: >
              Czy sztuczny agent potrafi prowadzić wewnętrzny dialog i zajmować stanowisko wobec siebie oraz
              innych? Arkadiusz oprze wystąpienie na badaniach prowadzonych w Polsce i w Chinach. Pokaże, jak
              różne modele językowe imitują samorefleksję i grupowe odpowiedzi ludzi z odmiennych kultur, wzdłuż
              osi Zachód-Wschód. Populację sztucznych agentów potraktuje przy tym jak grupę kulturową. Usłyszysz,
              gdzie leżą granice zastępowania ludzi agentami w przedsięwzięciach wrażliwych kulturowo.
            icon: brain.png


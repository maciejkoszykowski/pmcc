topTitle: PM Connect Conf
title   : Prowadzący Program Dnia

item    :
  - id : 1
    image         : images/speakers/Mariusz.png
    name          : Mariusz Lewandowski
    linkedInURL   : https://www.linkedin.com/in/panodmarketingu/
    instagramURL  : https://www.instagram.com/panodmarketingu/
    designation   : Konferansjer
    description   : >
      Specjalista z zakresu digital marketingu. Wykładowca akademicki, szkoleniowiec, konsultant biznesowy.
      Od kilku lat wspiera lokalne środowisko start-upowe, organizator cyklicznych spotkań networkingowych dla marketerów i przedstawicieli MSP.
      Twórca kursu video poświęconego wykorzystaniu serwisu LinkedIn w budowaniu marki osobistej, wydanego przez grupę Helion.
      Prywatnie fan dobrej kawy i spędzania czasu na łonie natury.
      Na Instagramie popularyzuje wiedzę ze swoich obszarów jako @panodmarketingu.

  - id : 2
    image         : images/speakers/Katarzyna.png
    name          : Katarzyna Łazarska
    designation   : Konferansjerka
    description   : >
      Od lat działa w świecie IT jako Project & Program Managerka - na co dzień w korporacji, po godzinach jako freelancerka
      pomagająca firmom okiełznać chaos projektowy i budować zespoły, w których naprawdę chce się pracować.
      Wierzy, że najlepsze produkty powstają, gdy ludzie czują się częścią misji, nie tylko projektu w kalendarzu.
      Angażuje się w PMI Kraków i Toastmasters, co-funder inicjatywy Neuro+, regularnie prowadzi konferencje i eventy branżowe.
      Empatia to jej supermoc. Prywatnie: snowboard, woda i długie spacery.

# item: każde logo można skalibrować osobno, pola opcjonalne:
#   width          : szerokość na desktopie w px, np. 220
#   height         : wysokość na desktopie w px
#     - podasz tylko jedno z (width, height) -> drugi wymiar skaluje się proporcjonalnie
#     - podasz oba -> oba ustawione na sztywno
#     - nie podasz żadnego -> domyślnie height 180 (jak dotychczas)
#   width_mobile   : jak wyżej, ale dla widoku mobilnego (domyślnie height 160)
#   height_mobile  : jak wyżej
#   padding        : tylko na desktopie (loga na mobile są wycentrowane, tego nie dotyczy) - w px,
#                     odsuwa logo od środka strony: dla loga z lewej kolumny dodaje padding z
#                     prawej, dla loga z prawej kolumny dodaje padding z lewej
#   margin_top_mobile : tylko na mobile - w px, dokłada dodatkowy odstęp PRZED danym logo (ponad
#                     automatyczną przerwę 15vw między logotypami), gdyby automat nie wystarczył
#   margin_top_desktop : to samo co margin_top_mobile, ale tylko na desktopie - w px, dokłada
#                     dodatkowy odstęp przed danym logo (działa dla pary logo i dla samotnego)
item   :

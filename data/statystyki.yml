# Statystyki SEO na ukrytej stronie /statystyki (dla marketingu i PM-a, bez linku w menu).
# Przegląd stron i test szybkości liczą się na żywo w przeglądarce, przy każdym wejściu.
enable    : true
topTitle  : PM Connect Conf
title     : Statystyki SEO

# Raporty Looker Studio — każdy w osobnej rozwijanej sekcji, w tej kolejności.
# url = link "embed": Looker Studio → Plik → Umieść raport → Włącz umieszczanie → Adres URL do umieszczenia.
# height = wysokość ramki w px (tyle, ile ma raport). Pusty url = zamiast raportu tylko opis i link do Google.
# link = strona Google z pełnymi danymi (dla osób z dostępem do konta).
reports:
  - title  : Ruch na stronie (Google Analytics)
    intro  : "Ile osób odwiedza stronę, skąd przychodzą, na jakich urządzeniach i które podstrony oglądają."
    url    : "https://datastudio.google.com/embed/reporting/da21f18e-fb21-4f2f-ba05-f998b016d47c/page/kIV1C"
    height : 2125
    link_label : Google Analytics
    link   : "https://analytics.google.com/"
  - title  : Wyniki w Google (Search Console)
    intro  : "Jak strona pojawia się w wyszukiwarce Google: wyświetlenia, kliknięcia, wpisywane frazy i średnia pozycja."
    url    : "https://datastudio.google.com/embed/reporting/5c732ac4-701e-44df-8709-3519e8b42424/page/6zXD"
    height : 1000
    link_label : Google Search Console
    link   : "https://search.google.com/search-console?resource_id=https%3A%2F%2Fpmcc.pmi.org.pl%2F"

# Adres testowany w PageSpeed (stały — `hugo server` podmienia adres strony na localhost, którego Google nie widzi)
psi_url : "https://pmcc.pmi.org.pl/"

# Klucz API do testu szybkości (Google PageSpeed Insights) jest w pliku static/psi-key.txt — poza gitem (.gitignore).
# Strona czyta go przy teście z adresu /psi-key.txt. Na serwer wgrywa się go ręcznie, obok index.html.
# Bez klucza Google często odrzuca test (błąd 429).
# Nowy klucz: console.cloud.google.com → PageSpeed Insights API → Dane logowania → Utwórz klucz API,
# ograniczony do strony (Websites: pmcc.pmi.org.pl/*) i do PageSpeed Insights API.

# Sekcja "Przydatne narzędzia" — darmowe narzędzia do samodzielnego sprawdzania strony.
# W linku: {url} = adres strony (psi_url), {url_enc} = ten sam adres zakodowany, {host} = sama domena.
# login: true = narzędzie wymaga zalogowania (np. konto Facebook/LinkedIn).
tools:
  - category : Szybkość
    items:
      - name : Google PageSpeed Insights
        desc : "Ocena szybkości na telefonie i komputerze, z listą rzeczy do poprawy."
        link : "https://pagespeed.web.dev/analysis?url={url_enc}"
      - name : GTmetrix
        desc : "Szybkość i to, co najdłużej się ładuje (wykres ładowania)."
        link : "https://gtmetrix.com/"
      - name : WebPageTest
        desc : "Szczegółowy test szybkości z różnych miejsc na świecie."
        link : "https://www.webpagetest.org/"
  - category : SEO i Google
    items:
      - name : Google Search Console
        desc : "Jak Google widzi stronę: frazy, pozycje, błędy indeksowania."
        link : "https://search.google.com/search-console?resource_id={url_enc}"
        login : true
      - name : Test wyników z elementami rozszerzonymi (Google)
        desc : "Czy Google widzi dane o wydarzeniu: datę, miejsce, bilety."
        link : "https://search.google.com/test/rich-results?url={url_enc}"
      - name : Schema Markup Validator
        desc : "Sprawdza dane strukturalne (schema.org) na stronie."
        link : "https://validator.schema.org/#url={url_enc}"
      - name : Bing Webmaster Tools
        desc : "To samo co Search Console, ale dla wyszukiwarki Bing."
        link : "https://www.bing.com/webmasters"
        login : true
      - name : Seobility SEO Check
        desc : "Szybki przegląd SEO jednej strony z listą problemów."
        link : "https://www.seobility.net/en/seocheck/"
  - category : Podgląd w social media
    items:
      - name : OpenGraph.xyz
        desc : "Jak wygląda link do strony na Facebooku, LinkedIn, X i w komunikatorach."
        link : "https://www.opengraph.xyz/url/{url_enc}"
      - name : Facebook Sharing Debugger
        desc : "Podgląd linku na Facebooku i odświeżenie go po zmianie obrazka lub opisu."
        link : "https://developers.facebook.com/tools/debug/?q={url_enc}"
        login : true
      - name : LinkedIn Post Inspector
        desc : "Podgląd linku na LinkedIn i odświeżenie go po zmianach."
        link : "https://www.linkedin.com/post-inspector/inspect/{url_enc}"
        login : true
  - category : Dostępność i bezpieczeństwo
    items:
      - name : WAVE
        desc : "Dostępność dla osób z niepełnosprawnościami: kontrast, opisy, nagłówki."
        link : "https://wave.webaim.org/report#/{url}"
      - name : SSL Labs
        desc : "Czy certyfikat HTTPS jest poprawny i bezpieczny (test trwa ok. 1–2 min)."
        link : "https://www.ssllabs.com/ssltest/analyze.html?d={host}"

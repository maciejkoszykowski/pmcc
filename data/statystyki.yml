# Statystyki SEO na ukrytej stronie /statystyki (dla marketingu i PM-a, bez linku w menu).
# Przegląd stron i test szybkości liczą się na żywo w przeglądarce, przy każdym wejściu.
enable    : true
topTitle  : PM Connect Conf
title     : Statystyki SEO

# Raporty Looker Studio — każdy w osobnej rozwijanej sekcji, w tej kolejności.
# url = link "embed": Looker Studio → Plik → Umieść raport → Włącz umieszczanie → Adres URL do umieszczenia.
# height = wysokość ramki w px (tyle, ile ma raport). Pusty url = zamiast raportu tylko opis i link do Google.
# link = strona Google z pełnymi danymi (dla osób z dostępem do konta).
reports:
  - title  : Ruch na stronie (Google Analytics)
    intro  : "Ile osób odwiedza stronę, skąd przychodzą, na jakich urządzeniach i które podstrony oglądają."
    url    : "https://datastudio.google.com/embed/reporting/da21f18e-fb21-4f2f-ba05-f998b016d47c/page/kIV1C"
    height : 2125
    link_label : Google Analytics
    link   : "https://analytics.google.com/"
  - title  : Wyniki w Google (Search Console)
    intro  : "Jak strona pojawia się w wyszukiwarce Google: wyświetlenia, kliknięcia, wpisywane frazy i średnia pozycja."
    url    : "https://datastudio.google.com/embed/reporting/5c732ac4-701e-44df-8709-3519e8b42424/page/6zXD"
    height : 1000
    link_label : Google Search Console
    link   : "https://search.google.com/search-console?resource_id=https%3A%2F%2Fpmcc.pmi.org.pl%2F"

# Adres testowany w PageSpeed (stały — `hugo server` podmienia adres strony na localhost, którego Google nie widzi)
psi_url : "https://pmcc.pmi.org.pl/"

# Klucz API do testu szybkości (Google PageSpeed Insights) jest w pliku static/psi-key.txt — poza gitem (.gitignore).
# Strona czyta go przy teście z adresu /psi-key.txt. Na serwer wgrywa się go ręcznie, obok index.html.
# Bez klucza Google często odrzuca test (błąd 429).
# Nowy klucz: console.cloud.google.com → PageSpeed Insights API → Dane logowania → Utwórz klucz API,
# ograniczony do strony (Websites: pmcc.pmi.org.pl/*) i do PageSpeed Insights API.

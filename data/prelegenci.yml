message: >
       Sylwetki prelegentów będą sukcesywnie pojawiać się na stronie konferencji po ich wcześniejszym przedstawieniu w mediach społecznościowych.
       <br> Zachęcamy do obserwowania naszych kanałów na LinkedIn oraz Facebooku, gdzie na bieżąco publikujemy informacje o programie i prelegentach.  
        <br> Odnośniki do naszych mediów społecznościowych znajdą Państwo <a href="#Lokalizacja">na dole naszej strony.</a> 

item    :
  - id : 1
    image : images/prelegenci/jakub_g.png
    title : prof. Jakub Growiec
    description : >
         Profesor ekonomii, Szkoła Główna Handlowa w Warszawie. Jego główne zainteresowania badawcze to wzrost gospodarczy, postęp technologiczny i ekonomia transformatywnej AI. Opublikował 35 artykułów naukowych w prestiżowych czasopismach międzynarodowych oraz monografię Accelerating Economic Growth: Lessons From 200 000 Years of Technological Progress and Human Development (Springer, 2022). Uważa, że transformatywna AI będzie źródłem ryzyka egzystencjalnego dla ludzkości.

    linkedin_post: https://www.linkedin.com/posts/pmipckuj-pom_pmconnectconf2026-pmcc2026-projectmanagement-activity-7483773758785306624-moJW?utm_source=share&utm_medium=member_desktop&rcm=ACoAAABsjpsBesX7_3-a3jKl9GtPbminHIt_Ff0
  - id : 5
    image : images/prelegenci/tomasz_z.png
    title : dr Tomasz Żabiński
    description : >
         Doktor nauk technicznych w dyscyplinie automatyka i robotyka (AGH w Krakowie), przedsiębiorca i menedżer z ponad 20-letnim doświadczeniem na styku nauki, biznesu, technologii i innowacji. Doświadczenie zdobywał jako założyciel i współwłaściciel spółki technologicznej z obszaru IT i automatyki oraz członek zarządów lub prezes spółek różnej wielkości, np. Europa Systems. Posiada praktyczne doświadczenie właścicielskie w budowaniu i skalowaniu startupów technologicznych, pozyskiwaniu kapitału zewnętrznego oraz przeprowadzaniu procesów sprzedaży spółki (Exited Founder).
         W środowisku korporacyjnym tworzył i rozwijał struktury Corporate Incubator, wspierając rozwój nowych przedsięwzięć technologicznych oraz wdrażanie innowacji w dużych organizacjach. Zarządzał zespołami badawczo-rozwojowymi i inżynierskimi pracującymi nad rozwiązaniami z zakresu automatyki, oprogramowania, sztucznej inteligencji i systemów wspierających cyfryzację procesów przemysłowych.
          Obecnie kieruje Laboratorium Zastosowań Sztucznej Inteligencji i Robotów Humanoidalnych na Politechnice Rzeszowskiej oraz jest współwłaścicielem i prezesem spółki doradczo-technologicznej 4Anatropi. Autor i współautor ponad 70 publikacji naukowych, konsultant i doradca w projektach technologicznych i innowacyjnych. Jego zainteresowania koncentrują się wokół praktycznych zastosowań koncepcji Przemysłu 4.0, w tym sztucznej inteligencji, robotyki oraz cyfryzacji systemów produkcyjnych i logistycznych.
    linkedin_post: https://www.linkedin.com/posts/pmipckuj-pom_pmconnectconf2026-pmcc2026-projectmanagement-activity-7484858385851486208-DVZe?utm_source=share&utm_medium=member_desktop&rcm=ACoAAABsjpsBesX7_3-a3jKl9GtPbminHIt_Ff0

  - id : 10
    image : images/prelegenci/lucyna_l.png
    title : Lucyna Ławniczak
    description : >
        Ambasadorka zmiany wg Emerging Change, konsultant organizacyjny, executive coach, psycholog, trener, mentor Fundacji Firm Rodzinnych, właściciel Autonomia Consulting. Dzięki narzędziom Teorii Ograniczeń osiąga z klientami przełomowe rezultaty w krótkim czasie. Rozwiązania psychodynamiki systemów wg Analizy Transakcyjnej ułatwiają jej wprowadzanie zmian i budowanie kultury zaangażowania. Od ponad 30 lat inspiruje, szkoli, pomaga wykorzystywać talenty ludzi, potencjały organizacji.  Dzięki zwinnemu podejściu w prowadzeniu projektów usprawnieniowych modeluje większą elastyczność organizacji klienta.

    linkedin_post: https://www.linkedin.com/posts/pmipckuj-pom_pmconnectconf2026-pmcc2026-projectmanagement-activity-7485925418907316224-ivEU?utm_source=share&utm_medium=member_desktop&rcm=ACoAAABsjpsBesX7_3-a3jKl9GtPbminHIt_Ff0



  - id : 12
    image : images/prelegenci/lukasz_k.png
    title : Łukasz Karwacki
    description : > 
          Pomaga liderom technologicznym, ekspertom i zarządom zamieniać złożone tematy w klarowną komunikację, która prowadzi do decyzji i realnego wpływu biznesowego. Pracuje na styku komunikacji, przywództwa i procesów decyzyjnych w momentach krytycznych decyzji, od prezentacji dla zarządów po wystąpienia konferencyjne i rozmowy strategiczne. Ma doświadczenie inżynierskie i ponad 20 lat doświadczenia w IT. Współpracował z ponad 70 mówcami przygotowującymi się do wystąpień TEDx, a jego podejście koncentruje się na clarity, executive presence i projektowaniu rozmów, które kończą się decyzjami.        
    linkedin_post: https://www.linkedin.com/posts/pmipckuj-pom_pmconnectconf2026-pmcc2026-projectmanagement-activity-7487378898872160257-XPr9?utm_source=share&utm_medium=member_desktop&rcm=ACoAAABsjpsBesX7_3-a3jKl9GtPbminHIt_Ff0
  - id : 15
    image : images/prelegenci/dorota_m.png
    title : Dorota Mleczko
    description : >
         Dorota jest Konsultantką AI oraz założycielką Paloma's AI Academy, gdzie z pasją pomaga profesjonalistom zdobywać praktyczne umiejętności AI bez zbędnej technicznej złożoności. 
         Przez 10 lat zdobywała doświadczenie w prowadzeniu projektów i zespołów, w tym 5 lat jako Agile Coach. Teraz łączy zwinne praktyki z możliwościami sztucznej inteligencji, co tworzy jej unikalne podejście do transformacji cyfrowej.   
    linkedin_post: https://www.linkedin.com/posts/pmipckuj-pom_pmconnectconf2026-pmcc2026-projectmanagement-activity-7488104776979836928-m52L?utm_source=share&utm_medium=member_desktop&rcm=ACoAAABsjpsBesX7_3-a3jKl9GtPbminHIt_Ff0

  - id : 25
    image : images/prelegenci/pawel_sz.png
    title : dr Paweł Szczęsny
    description : >
        Executive, founder i psycholog specjalizujący się w AI, syntetycznej kognicji i innowacjach opartych na danych. Ma wieloletnie doświadczenie w rolach liderskich na styku nauki, technologii i biznesu, obejmujące startupy AI, transformacje organizacji w kierunku AI-first, zarządzanie R&D oraz współpracę z sektorem farmaceutycznym i dużymi organizacjami. 
        Obecnie rozwija przedsięwzięcia związane z psychologią AI i projektowaniem syntetycznych person wspierających analizę decyzji, komunikacji i ryzyka w organizacjach.
    linkedin_post: https://www.linkedin.com/posts/pmipckuj-pom_pmconnectconf2026-pmcc2026-projectmanagement-activity-7492814577207009280-npNO?utm_source=share&utm_medium=member_desktop&rcm=ACoAAABsjpsBesX7_3-a3jKl9GtPbminHIt_Ff0
  
  - id : 30
    image : images/prelegenci/lukasz_w.png
    title : dr Łukasz Wojtkowski
    description : >
        Menedżer projektów, strateg i badacz z wieloletnim doświadczeniem na styku biznesu i technologii. 
        Specjalizuje się w projektowaniu i wdrażaniu rozwiązań AI w procesy organizacji. Zajmuje się analizami z zakresu wyjaśniania relacji człowieka z systemami sztucznej inteligencji na poziomie sprawczości i unboxingu algorytmów. Współpracuje z instytucjami naukowymi i firmami technologicznymi, tworząc infrastruktury danych, modele predykcyjne i systemy XAI. 
        Ma wieloletnie doświadczenie w zarządzaniu projektami b+r realizowanymi w Polsce, Portugalii, Anglii, Holandii i Belgii. Doradza organizacjom publicznym i biznesowym w zakresie strategii cyfrowych i wdrażania narzędzi AI. 
        Prowadzi zajęcia i szkolenia z komunikacji, innowacji i nowych technologii, łącząc doświadczenie akademickie z praktyką projektową.  
    linkedin_post: https://www.linkedin.com/posts/pmipckuj-pom_pmconnectconf2026-pmcc2026-projectmanagement-activity-7495353792578666497-QpbB?utm_source=share&utm_medium=member_desktop&rcm=ACoAAABsjpsBesX7_3-a3jKl9GtPbminHIt_Ff0

  - id : 35
    image : images/prelegenci/katarzyna_m.png
    title : Katarzyna Michno
    description : >
        Katarzyna Michno to Project Manager i analityk strategiczny z 19-letnim doświadczeniem w zarządzaniu portfelem projektów inwestycyjnych i badawczo-rozwojowych. Zrealizowała ponad 350 projektów o łącznej wartości ponad 800 mln PLN pozyskanego kapitału — dla polskich i międzynarodowych korporacji, jednostek sektora finansów publicznych oraz uczelni wyższych. Pełni funkcję zarządzającego 4Anatropi Sp. z o.o. — firmy doradczej specjalizującej się w strategii innowacji, finansowaniu B+R oraz wdrożeniach technologicznych w sektorach HiTech, robotyki, UAV, MedTech i cyfryzacji przemysłowej.
        Absolwentka ekonomii z wyróżnieniem, stypendystka Ministra Nauki i Szkolnictwa Wyższego, MBA (ścieżka angielskojęzyczna). Posiada międzynarodowe certyfikaty z zarządzania projektami i finansami, a także wieloletnią praktykę w modelowaniu finansowym, wycenie spółek i strukturyzacji złożonych projektów innowacyjnych.
        Od kilku lat koncentruje się na przecięciu zarządzania projektami i sztucznej inteligencji — prowadzi badania w ramach przygotowywanej pracy doktorskiej poświęconej modelowi AI-driven Project Management (ADPM), osadzonemu w paradygmacie human-autonomy teaming. Jej praca łączy perspektywę praktyka — koordynatora setek projektów — z ambicją zbudowania nowego standardu metodycznego dla hybrydowych zespołów człowiek–AI. Aktywnie uczestniczy w projektach konsorcyjnych Horizon Europe oraz aplikacjach w programie Ścieżka SMART / FENG.
    linkedin_post: https://www.linkedin.com/posts/pmipckuj-pom_pmconnectconf2026-pmcc2026-projectmanagement-activity-7500789610705461248-jIKD?utm_source=share&utm_medium=member_desktop&rcm=ACoAAABsjpsBesX7_3-a3jKl9GtPbminHIt_Ff0

